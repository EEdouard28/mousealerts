services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mousealerts
      POSTGRES_USER: mousealerts
      POSTGRES_PASSWORD: mousealerts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mousealerts"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://mousealerts:mousealerts@db:5432/mousealerts
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - TWILIO_ACCOUNT_SID=dev-account-sid
      - TWILIO_AUTH_TOKEN=dev-auth-token
      - TWILIO_PHONE_NUMBER=+1234567890
      - SENDGRID_API_KEY=dev-sendgrid-key
      - STRIPE_SECRET_KEY=dev-stripe-secret
      - STRIPE_WEBHOOK_SECRET=dev-stripe-webhook
      - SENTRY_DSN=
      - ENVIRONMENT=development
      - DISPLAY=:99
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../api:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    shm_size: 2gb
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://api:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - ../web:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
